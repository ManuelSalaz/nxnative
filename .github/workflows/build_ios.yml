name: Fast Parallel iOS Build (10x Matrix)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_ios.yml'
      - 'scripts/mac_build_app_only.py'

permissions:
  contents: write
  actions: read

jobs:
  build-app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen & Python fonttools
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          command -v xcodegen || brew install xcodegen
          command -v zstd || brew install zstd
          python3 -m pip install --break-system-packages fonttools || python3 -m pip install fonttools

      - name: Build DmIOS.app via Xcode 26
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cat mac_input.tar.zst.part_* > mac_app_input.tar.zst
          python3 scripts/mac_build_app_only.py mac_app_input.tar.zst tables.tar.zst

      - name: Upload DmIOS.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmios-app
          path: DmIOS_app.tar.zst
          compression-level: 0

  publish-release:
    needs: [build-app]
    runs-on: ubuntu-latest
    steps:
      - name: Download DmIOS.app artifact
        uses: actions/download-artifact@v4
        with:
          name: dmios-app
          path: artifacts/dmios-app

      - name: Wait for all 10 shader shards & publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            cnt=$(gh api repos/${{ github.repository }}/actions/runs/40432283884/artifacts --jq '.artifacts | length')
            echo "Shards ready in run 40432283884: $cnt / 10"
            if [ "$cnt" -ge 10 ]; then
              break
            fi
            sleep 10
          done
          mkdir -p artifacts_shards merged_metals
          gh run download 40432283884 -D artifacts_shards -R "${{ github.repository }}"
          for f in artifacts_shards/shard-*/shard_*.tar.zst; do
            tar --zstd -xf "$f" -C merged_metals
          done
          echo "Total compiled .metallib files merged: $(ls merged_metals | wc -l)"
          tar --zstd -cf compiled_metals.tar.zst -C merged_metals .
          cp artifacts/dmios-app/DmIOS_app.tar.zst DmIOS_app.tar.zst
          ls -lh DmIOS_app.tar.zst compiled_metals.tar.zst
          gh release delete v1.4.3-ios -y --cleanup-tag -R "${{ github.repository }}" 2>/dev/null || true
          gh release create v1.4.3-ios DmIOS_app.tar.zst compiled_metals.tar.zst -t "TotK 1.4.3 iOS Build" -n "Automated parallel iOS build" -R "${{ github.repository }}"
